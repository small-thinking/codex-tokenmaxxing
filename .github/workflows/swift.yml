name: Swift checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Show compiler environment
        run: |
          xcode-select -p
          swift --version
      - name: Validate scripts and bundle metadata
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          plutil -lint Resources/Info.plist
      - name: Run quota and transport checks
        run: ./scripts/test.sh
      - name: Build and verify signed app bundle
        run: ./scripts/build-app.sh
